<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motif Repeater</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <aside class="panel">
    <header class="brand">
      <h1>Motif Repeater</h1>
      <p>Drop a motif and try it as a block, half-drop, brick or tossed repeat.</p>
    </header>

    <section class="group">
      <h2>Motif</h2>
      <label class="dropzone" id="dropzone" for="file">
        <span class="thumb"><img id="thumb" alt=""></span>
        <span class="dz-text">
          <strong id="motifName">Sample motif</strong>
          <span id="motifMeta" class="mono">240 × 240 px</span>
          <span class="hint">Drop an image here, click to browse, or paste</span>
        </span>
      </label>
      <input type="file" id="file" accept="image/*" hidden>
      <p class="error" id="error" role="alert" hidden></p>
    </section>

    <section class="group">
      <h2>Repeat</h2>
      <div class="modes" role="radiogroup" aria-label="Repeat type">
        <button type="button" class="mode" role="radio" data-mode="block" aria-checked="true">
          <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="3" width="12" height="12"/><rect x="17" y="3" width="12" height="12"/><rect x="3" y="17" width="12" height="12"/><rect x="17" y="17" width="12" height="12"/></svg>
          Block
        </button>
        <button type="button" class="mode" role="radio" data-mode="halfdrop" aria-checked="false">
          <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="1" width="12" height="12"/><rect x="3" y="15" width="12" height="12"/><rect x="17" y="8" width="12" height="12"/><rect x="17" y="22" width="12" height="9"/><rect x="17" y="-6" width="12" height="12"/></svg>
          Half-drop
        </button>
        <button type="button" class="mode" role="radio" data-mode="brick" aria-checked="false">
          <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="3" width="12" height="12"/><rect x="15" y="3" width="12" height="12"/><rect x="8" y="17" width="12" height="12"/><rect x="22" y="17" width="9" height="12"/><rect x="-6" y="17" width="12" height="12"/></svg>
          Brick
        </button>
        <button type="button" class="mode" role="radio" data-mode="tossed" aria-checked="false">
          <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="4" y="4" width="9" height="9" transform="rotate(20 8.5 8.5)"/><rect x="19" y="6" width="9" height="9" transform="rotate(-35 23.5 10.5)"/><rect x="7" y="19" width="9" height="9" transform="rotate(50 11.5 23.5)"/><rect x="20" y="20" width="9" height="9" transform="rotate(-10 24.5 24.5)"/></svg>
          Tossed
        </button>
      </div>
    </section>

    <section class="group">
      <div class="row-label">
        <label for="scale">Scale</label>
        <output id="scaleOut" class="mono">100%</output>
      </div>
      <input type="range" id="scale" min="0" max="1000" value="500">
      <p class="note mono" id="tileSize">Motif on screen: 240 × 240 px</p>
    </section>

    <section class="group" id="offsetGroup" hidden>
      <div class="row-label">
        <span id="offsetLabel">Drop</span>
      </div>
      <div class="seg" role="radiogroup" aria-label="Offset">
        <button type="button" class="seg-btn" role="radio" data-offset="2" aria-checked="true">1/2</button>
        <button type="button" class="seg-btn" role="radio" data-offset="3" aria-checked="false">1/3</button>
        <button type="button" class="seg-btn" role="radio" data-offset="4" aria-checked="false">1/4</button>
      </div>
    </section>

    <section class="group" id="tossGroup" hidden>
      <div class="row-label">
        <label for="density">Motifs per repeat</label>
        <output id="densityOut" class="mono">9</output>
      </div>
      <input type="range" id="density" min="2" max="6" value="3">

      <div class="row-label">
        <label for="spacing">Spacing</label>
        <output id="spacingOut" class="mono">1.4×</output>
      </div>
      <input type="range" id="spacing" min="100" max="300" value="140">

      <div class="row-label">
        <label for="vary">Size variation</label>
        <output id="varyOut" class="mono">±15%</output>
      </div>
      <input type="range" id="vary" min="0" max="50" value="15">

      <div class="row-label">
        <label for="rotate">Rotation</label>
      </div>
      <select id="rotate">
        <option value="random">Random (any angle)</option>
        <option value="quarter">Quarter turns (0/90/180/270)</option>
        <option value="flip">Upright or upside down</option>
        <option value="none">None (all upright)</option>
      </select>

      <button type="button" class="btn" id="shuffle">Shuffle layout</button>
    </section>

    <section class="group">
      <div class="row-label">
        <label for="bg">Ground colour</label>
        <input type="color" id="bg" value="#f7f5f0">
      </div>
      <label class="check"><input type="checkbox" id="outline" checked> Show repeat unit</label>
    </section>

    <section class="group actions">
      <button type="button" class="btn primary" id="exportTile">Download repeat tile</button>
      <button type="button" class="btn" id="exportView">Download preview</button>
      <p class="note mono" id="unitSize">Repeat unit at full size: 240 × 240 px</p>
    </section>
  </aside>

  <main class="stage" id="stage">
    <canvas id="canvas" aria-label="Pattern preview"></canvas>
    <div class="chip mono" id="chip">Block</div>
  </main>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="overlay-box">Drop image to use it as the motif</div>
</div>

<script src="app.js"></script>
</body>
</html>
